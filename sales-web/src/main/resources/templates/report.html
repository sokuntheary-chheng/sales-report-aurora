<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Angkor Mart · monthly sales</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
        h1 { font-size: 1.4rem; }
        form { margin: 1rem 0; display: flex; gap: 1rem; align-items: center; }
        table { border-collapse: collapse; margin: 1rem 0; }
        th, td { border: 1px solid #ccc; padding: 0.3rem 0.8rem; text-align: left; }
        .error { color: firebrick; font-weight: bold; }
        .totals { font-size: 1.05rem; }
    </style>
</head>
<body>

<h1 th:text="'Angkor Mart · ' + ${month} + ' · ' + ${branch}">Angkor Mart</h1>

<form method="get" action="/report">
    <label>Month
        <input type="text" name="month" th:value="${month}" size="10"/>
    </label>
    <label>Branch
        <select name="branch">
            <option th:each="code : ${branches}" th:value="${code}" th:text="${code}"
                    th:selected="${code == branch}"></option>
        </select>
    </label>
    <button type="submit">Show</button>
</form>

<p class="error" th:if="${error}" th:text="${error}">error</p>

<div th:if="${summary}">
    <p class="totals"
       th:text="'Revenue USD ' + ${summary.revenue()} + ' · receipts ' + ${summary.receipts()}
                + ' · basket USD ' + ${summary.averageBasket()}
                + ' · rejected rows ' + ${#lists.size(rejected)}">totals</p>

    <h2>Revenue by category</h2>
    <table>
        <tr>
            <th>Category</th>
            <th>Revenue (USD)</th>
        </tr>
        <tr th:each="entry : ${summary.revenueByCategory()}">
            <td th:text="${entry.key}">Grocery</td>
            <td th:text="${entry.value}">0.00</td>
        </tr>
    </table>

    <h2>Top products</h2>
    <ul>
        <li th:each="product : ${summary.topProducts()}"
            th:text="${product.productName()} + ': USD ' + ${product.revenue()}">product</li>
    </ul>

    <h2>Rejected rows</h2>
    <ul th:if="${!#lists.isEmpty(rejected)}">
        <li th:each="row : ${rejected}" th:text="${row}">rejected</li>
    </ul>
    <p th:if="${#lists.isEmpty(rejected)}">none</p>
</div>

</body>
</html>
